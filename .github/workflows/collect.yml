name: collect

on:
  schedule:
    # 매일 09:00 KST (UTC 00:00). 하루 1회 — 상대 서버에 부담을 주지 않는다.
    - cron: '0 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 수집 실행
        id: run
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: npm run collect

      # 수집 결과를 리포지토리에 커밋해 다음 실행의 비교 기준으로 삼는다
      - name: 상태 저장
        if: always()
        run: |
          git config user.name  "run-alert bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: 수집 결과 갱신 $(date -u +%Y-%m-%d)"
          git push

      # 실패해도 로그는 남긴다
      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-log
          path: data/run.log
          retention-days: 14
